CONFIG_SPI=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
# CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=1800
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_270=y
CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
CONFIG_PMW3610_SCROLL_TICK=12
CONFIG_PMW3610_INVERT_X=y

CONFIG_PMW3610_POLLING_RATE_250=y
CONFIG_PMW3610_SMART_ALGORITHM=y

# 强制常醒：Performance 寄存器写 0xFD（FORCE_MODE 0xF0 | POLLING 0x0D），
# 传感器永不进入 REST1 / REST2，始终 4ms 采样（250Hz 硬件上限）。
# 背景：停手 128ms 即掉进 REST1（采样周期 40ms）。此时一次 20~40ms 的轻推
#       会整个落在「采样间隙 + 唤醒成像稳定期」里，位移被丢弃 → 光标完全不动。
#       这与「持续缓慢移动正常、小步点推常丢失」的现象完全吻合。
# 代价：功耗显著上升（dawn 插线使用，已确认可接受）。
# 注意：开启后 REST1 / REST2 相关时间参数全部失效，故不再配置。
CONFIG_PMW3610_FORCE_AWAKE=y

# CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=250

